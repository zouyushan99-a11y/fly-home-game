</main><script>(()=>{
// Shared world units for perspective drawing and swept collision tests.
const FLIGHT_SPEED = 9;
const LATERAL_RANGE = 23;
const EYE_HEIGHT = 23;
const STAGE_STARTS = [10,45,80,115,140];
const STAGE_ENDS = [45,80,115,140,165];
const hash = n => {const a=Math.sin(n*127.1+311.7)*43758.5453;return a-Math.floor(a)};
const pathX = z => Math.sin(z/175)*10+Math.sin(z/410)*14;
const cameraZ = progress => (progress-10)*FLIGHT_SPEED;
function makeDistrict(chapter, route='B') {
 const result=[],start=cameraZ(STAGE_STARTS[chapter]),length=(STAGE_ENDS[chapter]-STAGE_STARTS[chapter])*FLIGHT_SPEED;
 const count=chapter<2?23:chapter===2?10:chapter===3?12:0;
 for(let i=0;i<count;i++){
  const seed=chapter*223+i*19,side=i%2?-1:1;
  const z=start+52+i*(length-50)/count+hash(seed)*9;
  const width=chapter===3?7+hash(seed+3)*7:9+hash(seed+3)*15;
  const depth=chapter===3?9:10+hash(seed+4)*13;
  const extra=route==='C'?10:route==='B'?3:0;
  // Irregular clusters; primary row has clear centre, additional setbacks create plazas.
  const edge=10.5+extra+hash(seed+1)*12+(i%4===0?18:0);
  const height=chapter===3?7+hash(seed+5)*8:chapter===2?18+hash(seed+5)*30:17+hash(seed+5)*85;
  result.push({id:`${chapter}-building-${i}`,chapter,x:pathX(z)+side*(edge+width/2),z,width,depth,height,
   seed,side,route,glass:chapter!==3&&hash(seed+8)>.32,marked:route==='B'&&i%3!==0,
   severe:route==='A'&&i%4===1,style:i%5});
 }
 return result;
}
// Slab intersection of a swept bird point against a building's expanded footprint.
function hitsBuilding(building,from,to,radius=1.1){
 if(building.height<EYE_HEIGHT-1)return false;
 let enter=0,exit=1;
 for(const [axis,min,max] of [['x',building.x-building.width/2-radius,building.x+building.width/2+radius],['z',building.z-radius,building.z+building.depth+radius]]){
  const delta=to[axis]-from[axis];
  if(Math.abs(delta)<1e-9){if(from[axis]<min||from[axis]>max)return false;continue}
  let a=(min-from[axis])/delta,b=(max-from[axis])/delta;if(a>b)[a,b]=[b,a];
  enter=Math.max(enter,a);exit=Math.min(exit,b);if(enter>exit)return false;
 }
 return true;
}

const clamp=n=>Math.max(0,Math.min(100,n));
class Journey {
 constructor(){this.reset()}
 reset(){Object.assign(this,{health:100,energy:100,time:0,progress:0,x:0,chapter:-1,routes:{},events:new Set(),seen:new Set(),retryUsed:false,emergencyUsed:false,recovery:null,recoveryTime:0,done:false,success:false,started:false,paused:false,speed:1,clock:0,lesson:null,lessonQueue:[],grace:0,impact:0,slowImpact:0,notices:[],districts:new Map(),reflection:''})}
 get running(){return this.started&&!this.done&&!this.paused}
 event(id,health=0,energy=0){
  if(this.done||this.paused||this.events.has(id))return false;
  this.events.add(id);this.health=clamp(this.health+health);this.energy=clamp(this.energy+energy);
  if(health||energy)this.notices.push({id,health,energy,at:this.clock});
  return true;
 }
 choose(route){
  if(!this.running||this.recovery||![0,1,2,3].includes(this.chapter)||this.routes[this.chapter]||!['A','B','C'].includes(route))return false;
  this.routes[this.chapter]=route;if(route==='C')this.event(`detour-${this.chapter}`,0,-5);return true;
 }
 buildings(chapter=this.chapter){
  if(chapter<0||chapter>4)return [];
  const route=this.routes[chapter]||'B',key=`${chapter}-${route}`;
  if(!this.districts.has(key))this.districts.set(key,makeDistrict(chapter,route));
  return this.districts.get(key);
 }
 teach(id,priority=1){
  if(this.seen.has(id)||this.lessonQueue.some(x=>x.id===id))return false;
  this.lessonQueue.push({id,priority});this.lessonQueue.sort((a,b)=>b.priority-a.priority);return true;
 }
 beginLesson(){
  if(this.lesson||this.recovery||this.impact>0||!this.lessonQueue.length)return;
  const next=this.lessonQueue.shift();this.seen.add(next.id);this.lesson={id:next.id,remaining:4,total:4};
  this.grace=Math.max(this.grace,1.2);
 }
 collide(id,severe=false){
  if(!this.running||this.recovery||this.grace>0)return false;
  if(!this.event(`hit-${id}`,severe?-25:-15))return false;
  this.impact=.3;this.slowImpact=.9;this.grace=.8;this.teach('glass',2);this.checkRecovery();return true;
 }
 rest(id){if(this.event(`rest-${id}`,0,20))this.teach('green')}
 checkRecovery(){
  if(this.done||this.recovery)return;
  if(this.health===0){this.recovery='health';this.recoveryTime=0;this.lesson=null}
  else if(this.energy===0){this.recovery='energy';this.recoveryTime=0;this.lesson=null}
 }
 retry(){
  if(this.recovery!=='health'||this.retryUsed||this.recoveryTime<1)return false;
  this.retryUsed=true;this.health=70;this.energy=60;
  this.progress=STAGE_STARTS[Math.max(0,this.chapter)];this.x=0;
  delete this.routes[this.chapter];
  for(const key of [...this.events])if(key===`detour-${this.chapter}`||key===`rest-${this.chapter}`||key.startsWith(`hit-${this.chapter}-`)||key===`light-${this.chapter}`)this.events.delete(key);
  this.recovery=null;this.grace=2;this.speed=.65;this.notices=[];return true;
 }
 finish(success){if(this.done)return;if(success)this.event('arrival',0,10);this.done=true;this.success=success;this.recovery=null;this.lesson=null}
 tick(dt,steer=0){
  if(!this.running)return;
  dt=Math.max(0,Math.min(dt,.1));this.time+=dt;this.clock+=dt;
  this.grace=Math.max(0,this.grace-dt);this.impact=Math.max(0,this.impact-dt);this.slowImpact=Math.max(0,this.slowImpact-dt);
  this.notices=this.notices.filter(n=>this.clock-n.at<2.5);
  if(this.recovery){
   this.recoveryTime+=dt;
   if(this.recovery==='energy'&&this.recoveryTime>=3){this.energy=25;this.emergencyUsed=true;this.recovery=null;this.notices.push({id:'emergency',health:0,energy:25,at:this.clock})}
   else if(this.recovery==='health'&&this.retryUsed&&this.recoveryTime>=2)this.finish(false);
   return;
  }
  if(this.lesson){this.lesson.remaining-=dt;if(this.lesson.remaining<=0)this.lesson=null}
  this.beginLesson();
  const target=this.slowImpact>0?.4:this.lesson?.65:1;
  this.speed+=(target-this.speed)*(1-Math.exp(-dt*8));
  const previous={x:pathX(cameraZ(this.progress))+this.x*LATERAL_RANGE,z:cameraZ(this.progress)};
  this.progress+=dt*this.speed;
  if(this.progress>=10)this.x=Math.max(-1,Math.min(1,this.x+steer*dt*.62));
  const c=this.progress<10?-1:this.progress<45?0:this.progress<80?1:this.progress<115?2:this.progress<140?3:4;
  if(c!==this.chapter){
   if(this.chapter>=0&&this.chapter<4)this.event(`segment-${this.chapter}`,0,-8);
   this.chapter=c;if(c===4){this.event('arrival',0,10);this.teach('wetland')}
  }
  const local=this.progress-(STAGE_STARTS[c]||0);
  // Route observations remain neutral. No input chooses a middle route after 8 flight seconds.
  if(c>=0&&c<4&&!this.routes[c]&&local>=8)this.choose(this.x<-.4?'A':this.x>.4?'C':'B');
  if(c===0&&local>=28)this.teach('glass'); // guaranteed lesson even with no impact
  if(c===1&&local>=16){
   if(this.event('light-1',0,-10)){
    const r=this.routes[c];this.x=Math.max(-1,Math.min(1,this.x+(r==='A'?.34:r==='C'?.08:.16)));
    this.teach('light',2);
   }
  }
  if(c===2&&local>=7)this.teach('corridor');
  if((c===0||c===2||c===3)&&this.routes[c]==='C'&&local>=21)this.rest(c);
  if(c===2&&local>=25)this.teach('green');
  const current={x:pathX(cameraZ(this.progress))+this.x*LATERAL_RANGE,z:cameraZ(this.progress)};
  if(c>=0&&c<4&&local>=8&&this.grace===0){
   for(const building of this.buildings()){
    if(hitsBuilding(building,previous,current)&&this.collide(building.id,building.severe)){
     this.x=Math.max(-1,Math.min(1,this.x-building.side*.16));break;
    }
   }
  }
  this.checkRecovery();
  if(this.progress>=165)this.finish(true);
 }
}

const palettes=[
 {sky:'#5fafe1',haze:'#dceaf0',ground:'#a6baa7',water:'#509caf',glass:['#65a4c5','#a1cbd8','#3c718e'],stone:['#d8c8aa','#ae9276','#d1d4ce']},
 {sky:'#101e42',haze:'#5a6585',ground:'#35464d',water:'#294963',glass:['#29445f','#4b6178','#152c46'],stone:['#66687a','#505b6b','#777c87']},
 {sky:'#90b9d6',haze:'#f0d7b5',ground:'#718957',water:'#8badb1',glass:['#79a9b6','#bccdcd','#577b91'],stone:['#d3c7ac','#a8977e','#dee0d4']},
 {sky:'#8dc5e3',haze:'#eee7ca',ground:'#8f9e66',water:'#84b8bc',glass:['#8cb6c5','#dae5df','#618a9b'],stone:['#eee0ba','#c7a882','#dcd9c5']},
 {sky:'#eeb584',haze:'#f9e6ba',ground:'#a5aa75',water:'#b4ccbf',glass:['#83afbc','#cdded4','#6b8998'],stone:['#eadbb8','#cab797','#dce2c2']}
];
const lerp=(a,b,t)=>a+(b-a)*t;
function colorMix(a,b,t){const av=parseInt(a.slice(1),16),bv=parseInt(b.slice(1),16);return '#'+[16,8,0].map(s=>Math.round(lerp((av>>s)&255,(bv>>s)&255,t)).toString(16).padStart(2,'0')).join('')}
function stagePalette(g){
 const c=Math.max(0,g.chapter),t=c?Math.min(1,Math.max(0,(g.progress-STAGE_STARTS[c])/6)):1;
 const p=palettes[c],prev=palettes[Math.max(0,c-1)],r={};
 for(const key of Object.keys(p))r[key]=Array.isArray(p[key])?p[key].map((v,i)=>colorMix(prev[key][i],v,t)):colorMix(prev[key],p[key],t);
 return r;
}
class FlightRenderer {
 constructor(canvas){this.canvas=canvas;this.ctx=canvas.getContext('2d',{alpha:false});this.dpr=1;this.frames=0;this.renderCost=0;this.textures=new Map();this.foliage=new Map();this.nightMix=0;this.wetland=null}

const lessons={
 glass:{title:['玻璃幕牆與鳥類碰撞','Glass façades & bird collisions'],text:['玻璃可能反射天空與植被，或因透明而難以辨識。外部可見標記及鳥類友善玻璃設計，有助降低碰撞風險，但不能完全消除風險。','Glass can reflect sky and vegetation or appear transparent. External markers and bird-friendly glazing can reduce collision risk, but cannot eliminate it.'],short:['玻璃反射或透明，可能令鳥類誤判。外部可見標記可降低碰撞風險。','Reflective or transparent glass can confuse birds. External markers can reduce collision risk.']},

 corridor:{title:['生態空間與廊道','Ecological spaces & corridors'],text:['連通的綠地、樹木與水源可能提供遮蔽、覓食及停歇機會。其價值仍取決於棲地品質、食物及人為干擾。','Connected vegetation and water may offer shelter, food and resting places. Their value depends on habitat quality, food and human disturbance.'],short:['連通的綠地與水源有助移動與覓食；棲地品質同樣重要。','Connected greenery and water can support movement and foraging. Habitat quality matters.']},

function initAudio(){
 if(audioContext){audioContext.resume().catch(()=>{});return}
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){$('mute').disabled=true;return}
  audioContext=new Audio();const buffer=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  const source=audioContext.createBufferSource();source.buffer=buffer;source.loop=true;
  const filter=audioContext.createBiquadFilter();filter.type='lowpass';filter.frequency.value=500;
  audioGain=audioContext.createGain();audioGain.gain.value=0;
  source.connect(filter).connect(audioGain).connect(audioContext.destination);source.start();audioContext.resume().catch(()=>{});
 }catch{$('mute').disabled=true}
}

 for(const panel of ['pausePanel','helpPanel','recovery','ending']){
  const dialog=$(panel).querySelector('.dialog');if(!dialog||dialog.querySelector('.modal-language'))continue;
  const button=document.createElement('button');button.className='modal-language';button.textContent='繁中 | EN';button.setAttribute('aria-label','切換語言 / Switch language');
  button.onclick=()=>{$('language').click()};dialog.prepend(button);
 }
}
function labels(){
 document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
 $('language').setAttribute('aria-label','切換語言 / Switch language');
 for(const [id,label] of [['pause',g.paused?tr('繼續飛行','Resume flight'):tr('暫停','Pause')],['help',tr('說明與飛行筆記','Instructions & field notes')],['mute',muted?tr('開啟聲音','Unmute'):tr('靜音','Mute')],['restart',tr('重新開始','Restart')]]){$(id).title=label;$(id).setAttribute('aria-label',label)}
 $('pause').textContent=g.paused?'>':'II';$('mute').textContent=muted?'♪̸':'♪';$('mute').setAttribute('aria-pressed',String(muted));
 setText('introText',tr('與家人失散的候鳥，將穿過城市、夜色與綠地，飛向米埔濕地。觀察建築間的通道，選擇自己的路。','A bird separated from its family crosses city, night and green space toward Mai Po. Observe the passages between buildings and choose your route.'));
 setText('start',tr('展翅啟程 ↗','Begin the journey ↗'));
 setText('introHint',tr('按 A / D 或 ← / →；觸屏可按住兩側箭頭。遊戲數值並非科學數據。','Use A / D or ← / →; on touchscreens hold the side arrows. Game values are not scientific data.'));
 setText('controlHint',tr('A / D · ← / → · 按住轉向','A / D · ← / → · Hold to steer'));
 uiKey='';lessonKey='';endKey='';recoveryKey='';updateUI();modalLanguageButtons();
}
function restart(){g.reset();g.started=true;clearInput();accumulator=0;$('intro').hidden=true;for(const id of ['pausePanel','helpPanel','ending','recovery'])$(id).hidden=true;uiKey=lessonKey=endKey=recoveryKey='';initAudio();labels()}
function pause(value=true){if(!g.started||g.done)return;g.paused=value;clearInput();$('pausePanel').hidden=!value;
 if(value)$('pausePanel').innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pauseTitle"><h2 id="pauseTitle">${tr('飛行已暫停','Flight paused')}</h2><p>${tr('準備好再繼續。','Continue when you are ready.')}</p><button id="resume" class="primary">${tr('繼續飛行','Resume flight')}</button></div>`;
 if(value){$('resume').onclick=()=>pause(false);$('resume').focus()}else $('pause').focus();labels();updateAudio();
}
function help(){
 helpWasPaused=g.paused;g.paused=true;clearInput();$('pausePanel').hidden=true;$('helpPanel').hidden=false;
 $('helpPanel').innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><h2 id="helpTitle">${tr('飛行指南','Flight guide')}</h2><p>${tr('使用 A / D 或左右方向鍵；觸屏按住左下或右下箭頭。鬆開即停止轉向。Escape 或 II 暫停。觀察立體樓房之間的空間，碰到外牆會扣健康值。','Use A / D or arrow keys; on touchscreens hold the lower-left or lower-right button. Release to stop steering. Escape or II pauses. Observe the spaces between buildings; touching a façade costs health.')}</p><p>${tr('知識卡會自動淡出；飛行暫時降速至約 65%，仍可轉向。短暫保護期不代表整段無碰撞。每完成一段 −8 體力，繞道 −5，照明修正 −10，指定停歇點 +20，抵達濕地 +10。','Field notes fade automatically. Flight slows to about 65%, while steering remains available. A brief grace period does not remove all collision risk. Segment −8 energy; detour −5; lighting correction −10; designated rest +20; wetland arrival +10.')}</p><details><summary>${tr('完整飛行筆記','Complete field notes')}</summary>${Object.values(lessons).map(l=>`<h3>${l.title[lang==='zh'?0:1]}</h3><p>${l.text[lang==='zh'?0:1]}</p>`).join('')}</details><button id="closeHelp" class="primary">${tr('返回遊戲','Back to game')}</button></div>`;
 $('closeHelp').onclick=()=>{$('helpPanel').hidden=true;g.paused=helpWasPaused;clearInput();if(helpWasPaused)pause(true);else labels()};$('closeHelp').focus();modalLanguageButtons();updateAudio();
}
$('start').onclick=restart;$('restart').onclick=restart;
$('pause').onclick=()=>pause(!g.paused);$('help').onclick=help;
$('mute').onclick=()=>{muted=!muted;initAudio();labels();updateAudio()};
$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';const isHelp=!$('helpPanel').hidden,was=helpWasPaused;if(isHelp){help();helpWasPaused=was}else if(!$('pausePanel').hidden)pause(true);labels()};
addEventListener('keydown',e=>{
 if(e.key==='Tab'){
  const overlay=['ending','recovery','helpPanel','pausePanel'].map($).find(el=>!el.hidden);
  if(overlay){const items=[...overlay.querySelectorAll('button:not(:disabled),textarea,summary,a')];if(items.length){const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||!overlay.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!overlay.contains(document.activeElement))){e.preventDefault();first.focus()}}}
 }

 if(e.target instanceof HTMLTextAreaElement)return;
 if(e.key==='Escape'){e.preventDefault();if(!$('helpPanel').hidden)$('closeHelp').click();else pause(!g.paused);return}
 if(['a','d','arrowleft','arrowright'].includes(e.key.toLowerCase())&&g.running){e.preventDefault();keys.add(e.key.toLowerCase())}
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{clearInput();if(g.running)pause(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&g.running)pause(true)});
for(const [id,direction] of [['left',-1],['right',1]]){
 const button=$(id);
 button.addEventListener('pointerdown',e=>{if(!g.running||g.recovery)return;e.preventDefault();pointers.set(e.pointerId,direction);button.classList.add('held');button.setPointerCapture(e.pointerId)});
 const release=e=>{pointers.delete(e.pointerId);button.classList.remove('held')};
 for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,release);
 button.addEventListener('contextmenu',e=>e.preventDefault());
}
function renderRoutes(){
 const key=`${g.chapter}-${g.routes[g.chapter]||''}-${lang}-${g.recovery||''}-${g.done}`;if(key===uiKey)return;uiKey=key;
 $('choices').replaceChildren();if(!g.started||g.done||g.recovery||!routes[g.chapter]||g.routes[g.chapter])return;
 routes[g.chapter].forEach((r,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${'ABC'[i]} · ${r[lang==='zh'?0:1]}</b><span>${r[lang==='zh'?2:3]}</span>`;b.onclick=()=>{g.choose('ABC'[i]);renderRoutes()};$('choices').append(b)});
}
function renderLesson(){
 const active=g.lesson&&!g.recovery&&!g.done; $('lesson').hidden=!active;if(!active)return;
 const short=innerWidth<650||innerHeight<520,key=g.lesson.id+lang+short;
 if(key!==lessonKey){lessonKey=key;const l=lessons[g.lesson.id],i=lang==='zh'?0:1;
  setText('lessonTag',tr('飛行筆記 · 緩速觀察','FIELD NOTES · SLOW FLIGHT'));setText('lessonTitle',l.title[i]);setText('lessonText',(short?l.short:l.text)[i]);
 }
 const age=g.lesson.total-g.lesson.remaining;$('lesson').style.opacity=Math.min(1,age/.35,g.lesson.remaining/.4);
}
function renderRecovery(){
 $('recovery').hidden=!g.recovery;if(!g.recovery)return;
 const ready=g.recoveryTime>=1,key=`${g.recovery}-${g.retryUsed}-${ready}-${lang}`;if(key===recoveryKey)return;recoveryKey=key;clearInput();
 const energy=g.recovery==='energy';
 $('recovery').innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h2>${energy?tr('體力不足，需要停歇','Energy depleted. Rest is needed.'):tr('本次飛行已中斷','Flight interrupted')}</h2><p>${energy?tr('正在滑行至最近的指定停歇點。約 3 秒後恢復至 25 體力，健康值不變。','Gliding to the nearest designated rest. Energy returns to 25 after about 3 seconds; health is unchanged.'):g.retryUsed?tr('正在整理旅程回顧。','Preparing your journey reflection.'):tr('你還有一次重試。返回本章起點，健康值恢復至 70、體力至 60；保留之前完成的旅程與知識。','One retry remains. Return to this chapter with health 70 and energy 60. Previous progress and lessons are preserved.')}</p>${!energy&&!g.retryUsed?`<button id="retry" class="primary" ${ready?'':'disabled'}>${tr('從檢查點重試','Retry from checkpoint')}</button>`:''}</div>`;
 if($('retry'))$('retry').onclick=()=>{if(g.retry()){clearInput();uiKey='';recoveryKey='';updateUI()}};
}
function renderEnding(){
 $('ending').hidden=!g.done;if(!g.done)return;
 const key=`${lang}-${g.success}`;if(key===endKey)return;
 if($('reflection'))g.reflection=$('reflection').value;endKey=key;
 $('ending').innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><span class="eyebrow">SDG 15 · LIFE ON LAND · 陸域生命</span><h1>${g.success?tr('終於，再次相聚','Together, at last.'):tr('本次旅程未能完成','Journey not completed')}</h1><p>${g.success?tr('你抵達米埔內后海灣濕地，回到家人身邊。','You have reached Mai Po Inner Deep Bay and reunited with your family.'):tr('飛行中斷了，但你的旅程留下值得思考的事。','Flight was interrupted, but your journey still offers something to reflect on.')}</p><ul>${Object.values(lessons).filter((_,i)=>i!==3).map(l=>`<li>${l.short[lang==='zh'?0:1]}</li>`).join('')}</ul><p>${tr('保護陸地生態系統，維護生物多樣性，並減少人類活動對野生動物及其棲息地造成的潛在影響。城市發展與生物多樣性保護可以並行。','Protect terrestrial ecosystems, conserve biodiversity, and reduce potential impacts on wildlife and habitats. Urban development and biodiversity conservation can coexist.')}</p><p>${tr('如果你可以改變一項城市設計，你會怎樣讓城市對鳥類更友善？','If you could change one feature of the city, how would you make it more bird-friendly?')}</p><textarea id="reflection" aria-label="反思 / Reflection" placeholder="${tr('寫下你的想法（僅保留於此頁面）','Your reflection (kept on this page only)')}"></textarea><details><summary>${tr('延伸閱讀','Further reading')}</summary><p><a href="https://sdgs.un.org/goals/goal15" target="_blank" rel="noopener">UN · SDG 15</a> · <a href="https://www.wwf.org.hk/" target="_blank" rel="noopener">WWF Hong Kong</a></p><small>${tr('遊戲景觀為香港啟發的虛構場景；數值並非科學測量。','Landscapes are fictional and Hong Kong-inspired; game values are not scientific measurements.')}</small></details><button id="again" class="primary">${tr('再飛一次','Fly again')} ↗</button></div>`;
 $('reflection').value=g.reflection;$('again').onclick=restart;clearInput();
}
function updateUI(){
 setText('healthLabel',`${tr('健康','Health')} ${g.health}`);setText('energyLabel',`${tr('體力','Energy')} ${g.energy}`);
 $('health').value=g.health;$('energy').value=g.energy;
 setText('chapter',g.chapter<0?tr('與家人同行','With your family'):names[g.chapter][lang==='zh'?0:1]);setText('stage',`${String(g.chapter+2).padStart(2,'0')} / 06`);
 setText('time',`${String(Math.floor(g.time/60)).padStart(2,'0')}:${String(Math.floor(g.time%60)).padStart(2,'0')}`);
 setText('route',g.routes[g.chapter]?` · ${g.routes[g.chapter]}`:'');
 $('pause').disabled=!g.started||g.done;
 let caption='';if(g.started&&!g.done&&!g.recovery){
  if(g.progress<4)caption=tr('遷徙途中，你與家人一同飛越海岸。','During migration, you fly above the coast with your family.');
  else if(g.progress<6)caption=tr('隊形改變，你與家人失去了聯繫。','The formation changes. You lose contact with your family.');
  else if(g.progress<10)caption=tr('前方是繁忙的城市；遠處的米埔濕地，或許是重聚之地。','A bustling city lies ahead. Mai Po’s wetlands may offer a chance to reunite.');
  else if(g.chapter===4&&g.progress<145)caption=tr('米埔濕地就在眼前，家人正在等待。','Mai Po lies ahead. Your family is waiting.');
 }
 setText('caption',caption);
 const notices=g.notices.slice(-2);setText('delta',notices.map(n=>`${n.health?`${tr('健康','Health')} ${n.health}`:''}${n.energy?`${tr('體力','Energy')} ${n.energy>0?'+':''}${n.energy}`:''}`).join(' · '));
 renderRoutes();renderLesson();renderRecovery();renderEnding();modalLanguageButtons();
 $('controls').inert=g.paused||!!g.recovery||g.done||!g.started;
 $('choices').inert=g.paused||!!g.recovery||g.done;
 updateAudio();
}
// Fixed 60Hz simulation shares identical movement and collisions across input devices.
function advance(dt){accumulator+=Math.min(dt,.1);while(accumulator>=1/60){g.tick(1/60,steering());accumulator-=1/60}updateUI()}
function frame(ms){const dt=last?Math.min((ms-last)/1000,.1):0;last=ms;advance(dt);renderer.draw(g,lang);requestAnimationFrame(frame)}
addEventListener('resize',()=>{lessonKey='';updateUI()});
labels();requestAnimationFrame(frame);

})();</script></body></html>
