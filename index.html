<body><main id="game"><canvas id="scene" aria-label="候鳥第一人稱飛行 / First-person bird flight"></canvas>
<header><div class="brand">FLY HOME<small>飛越香港</small></div><nav aria-label="遊戲選單 / Game menu"><button id="language">繁中 | EN</button><button id="pause" aria-label="暫停 / Pause">II</button><button id="help" aria-label="說明 / Instructions">?</button><button id="mute" aria-label="聲音 / Sound">♪</button><button id="restart" aria-label="重新開始 / Restart">↻</button></nav></header>
<section id="hud"><div class="vitals"><div class="vital"><label id="healthLabel" for="health"></label><meter id="health" min="0" max="100" value="100"></meter></div><div class="vital"><label id="energyLabel" for="energy"></label><meter id="energy" min="0" max="100" value="100"></meter></div></div><div class="chapter"><span id="chapter"></span><span><b id="stage">01 / 06</b> · <time id="time">00:00</time><small id="route"></small></span></div></section>
<section id="intro" class="panel"><span class="eyebrow">A MIGRATORY BIRD’S JOURNEY</span><h1>Fly Home</h1><h2>飛越香港</h2><p id="introText"></p><button id="start" class="primary"></button><small id="introHint"></small></section>
<div id="caption" aria-live="polite"></div><section id="choices" aria-label="路線選擇 / Route choice"></section><aside id="lesson" role="status" hidden><span id="lessonTag"></span><h2 id="lessonTitle"></h2><p id="lessonText"></p></aside><div id="delta" aria-live="polite"></div><div id="interference" class="flight-status" role="status" hidden></div>
<section id="pausePanel" class="overlay" hidden></section><section id="helpPanel" class="overlay" hidden></section><section id="recovery" class="overlay" hidden></section><section id="ending" class="overlay" hidden></section>
<footer id="controls"><button id="left" aria-label="按住向左飛行 / Hold to steer left">←</button><span id="controlHint"></span><button id="right" aria-label="按住向右飛行 / Hold to steer right">→</button></footer>
</main><div id="knowledgeFeedback" role="status" style="position:absolute;left:20%;right:20%;bottom:140px;background:#112d44e6;padding:10px;z-index:5;pointer-events:none" hidden></div><script>(()=>{
// Shared world units for perspective drawing and swept collision tests.
const FLIGHT_SPEED = 9;
const LATERAL_RANGE = 23;
const EYE_HEIGHT = 34;
const STAGE_STARTS = [10,45,80,115,140];
const STAGE_ENDS = [45,80,115,140,165];
const hash = n => {const a=Math.sin(n*127.1+311.7)*43758.5453;return a-Math.floor(a)};
const pathX = z => Math.sin(z/175)*10+Math.sin(z/410)*14;
const cameraZ = progress => (progress-10)*FLIGHT_SPEED;
// Route difficulty changes actual geometry. Every choice shares the entrance;
// its distinct blocks begin well beyond the decision, never around the player.
const ROUTE_PROFILES = {
 A:{cityCount:44,parkCount:17,villageCount:21,gap:10,turn:4.5,driftDuration:6,driftStrength:.14},
 B:{cityCount:32,parkCount:13,villageCount:16,gap:16,turn:2.7,driftDuration:3,driftStrength:.085},
 C:{cityCount:20,parkCount:9,villageCount:11,gap:24,turn:1.2,driftDuration:1,driftStrength:.035}
};
// Geometry is generated once per district/route. Drawing and swept collision share it.
function worldPoint(b,x,y,z){
 const a=b.angle||0,co=Math.cos(a),si=Math.sin(a),cz=b.z+b.depth/2;
 return [b.x+x*co+z*si,y,cz-x*si+z*co];
}
function buildingParts(b){
 if(b.kind==='stepped')return [
  {w:b.width,d:b.depth,y:0,h:b.height*.42},
  {w:b.width*.76,d:b.depth*.78,y:b.height*.42,h:b.height*.34},
  {w:b.width*.51,d:b.depth*.55,y:b.height*.76,h:b.height*.24}];
 if(b.kind==='commercial')return [
  {w:b.width,d:b.depth,y:0,h:Math.min(12,b.height*.25)},
  {w:b.width*.68,d:b.depth*.74,y:Math.min(12,b.height*.25),h:b.height-Math.min(12,b.height*.25)}];
 return [{w:b.width,d:b.depth,y:0,h:b.height}];
}
function makeDistrict(chapter,route='B'){
 if(chapter<0||chapter>=4)return [];
 const result=[],start=cameraZ(STAGE_STARTS[chapter]),length=(STAGE_ENDS[chapter]-STAGE_STARTS[chapter])*FLIGHT_SPEED;
 const decorate=b=>{
  const h=hash(b.seed+81);
  b.kind=b.solidTree?'tree':chapter===3?(h<.84?'village':'public'):chapter===2?(h<.72?'public':'residential'):b.central?'stepped':h<.3?'office':h<.58?'residential':h<.8?'commercial':'stepped';
  b.glass=['office','stepped','public'].includes(b.kind);
  b.angle=b.solidTree?0:(hash(b.seed+72)-.5)*.94;
  if(b.kind==='public'){b.height=7+hash(b.seed+2)*9;b.width*=1.2;}
  if(b.kind==='village'){b.height=7+hash(b.seed+5)*8;b.depth=8+hash(b.seed+9)*5;}
  const extent=Math.abs(Math.cos(b.angle))*b.width/2+Math.abs(Math.sin(b.angle))*b.depth/2;
  if(!b.central)b.x=pathX(b.z)+b.turn+b.side*(b.edge+extent);
  return b;
 };
 for(let i=0;i<4;i++){
  const seed=chapter*223+i*19,side=i%2?-1:1,z=start+70+i*15;
  result.push(decorate({id:`${chapter}-entry-${i}`,entry:true,chapter,z,width:10+hash(seed)*7,depth:10,
   height:chapter===3?12:chapter===2?20:44+hash(seed+5)*34,seed,side,route:'B',marked:false,severe:false,style:i%5,turn:0,edge:18}));
 }
 if(route==='entry')return result;
 // Parcels are groups around courtyards, not alternating roadside rows.
 const layouts=[[[42,0],[64,0],[42,26],[64,26]], [[-65,0],[-43,22],[-65,44]], [[48,0],[72,28],[-55,42]], [[-68,0],[66,8]], [[-44,0],[-68,23],[52,35]]];
 const overlaps=(a,b)=>{const ext=o=>[Math.abs(Math.cos(o.angle||0))*o.width/2+Math.abs(Math.sin(o.angle||0))*o.depth/2,Math.abs(Math.sin(o.angle||0))*o.width/2+Math.abs(Math.cos(o.angle||0))*o.depth/2];const A=ext(a),B=ext(b);return Math.abs(a.x-b.x)<A[0]+B[0]+2&&Math.abs(a.z+a.depth/2-b.z-b.depth/2)<A[1]+B[1]+2;};
 for(let parcel=0;parcel<3;parcel++){
  const template=(chapter+parcel+'ABC'.indexOf(route))%5,anchor=start+125+parcel*(length-155)/3;
  for(const [j,[dx,dz]] of layouts[template].entries()){
   const seed=chapter*313+parcel*47+j*19,z=anchor+dz;
   const b=decorate({id:`${chapter}-parcel-${parcel}-${j}`,chapter,central:true,z,x:pathX(z)+dx,width:12+hash(seed)*6,depth:12,height:chapter<2?40+hash(seed+3)*55:15+hash(seed)*10,seed,side:Math.sign(dx),route,style:j%5,marked:route==='B',severe:false,template});
   if(!result.some(other=>overlaps(b,other)))result.push(b);
  }
 }
 // Broad alternating openings force deliberate steering. Full-height geometry
 // and collision share these footprints; every opening remains comfortably wider than the bird.
 const gateCount=chapter===0?3:chapter===3?2:4,gap=route==='A'?6:route==='B'?8:10;
 for(let i=0;i<gateCount;i++){
  const offset=138+i*(length-170)/Math.max(1,gateCount-1),z=start+offset;
  const opening=(i%2?-1:1)*(route==='C'?12:10)*(chapter%2?-1:1);
  for(const side of [-1,1]){
   const left=side<0?-34:opening+gap,right=side<0?opening-gap:34;
   const b={id:`${chapter}-challenge-${i}-${side}`,chapter,entry:false,x:pathX(z)+(left+right)/2,z,width:right-left,depth:9,height:42+hash(i+chapter)*12,angle:0,seed:chapter*79+i*11+side,side,route,glass:chapter<2,kind:chapter<2?'office':'residential',marked:route==='B',severe:false,style:i%5,gate:i,opening,gap,template:['courtyard','diagonal','landmark','plaza','garden'][(chapter+i)%5]};
   for(let j=result.length-1;j>=0;j--)if(!result[j].entry&&overlaps(b,result[j]))result.splice(j,1);
   result.push(b);
  }
 }
 return result;
}
// Transform the swept bird into local building space; slab-test the actual
// tier at flight altitude, conservatively expanded by the unchanged bird radius.
function hitsBuilding(building,from,to,radius=1.1){
 if(building.height<EYE_HEIGHT-1)return false;
 const a=building.angle||0,co=Math.cos(a),si=Math.sin(a),cz=building.z+building.depth/2;
 const local=p=>({x:(p.x-building.x)*co-(p.z-cz)*si,z:(p.x-building.x)*si+(p.z-cz)*co});
 const f=local(from),t=local(to);
 return buildingParts(building).some(part=>{
  if(part.y>EYE_HEIGHT+1||part.y+part.h<EYE_HEIGHT-1)return false;
  let enter=0,exit=1;
  for(const [axis,half] of [['x',part.w/2],['z',part.d/2]]){
   const min=-half-radius,max=half+radius,delta=t[axis]-f[axis];
   if(Math.abs(delta)<1e-9){if(f[axis]<min||f[axis]>max)return false;continue;}
   let aa=(min-f[axis])/delta,bb=(max-f[axis])/delta;if(aa>bb)[aa,bb]=[bb,aa];
   enter=Math.max(enter,aa);exit=Math.min(exit,bb);if(enter>exit)return false;
  }
  return true;
 });
}

// Wildlife positions use simulation progress, so pause freezes every animal.
function wildlife(chapter,progress){
 const local=progress-STAGE_STARTS[chapter];
 if(chapter!==2&&chapter!==4)return null;
 const encounter=chapter===2?18:12,z=cameraZ(STAGE_STARTS[chapter]+encounter);
 return {id:`flock-${chapter}`,z,x:pathX(z)+(chapter===2?Math.max(-22,Math.min(22,(local-encounter)*3.4)):0),height:chapter===2?35:2,local,encounter};
}

const clamp=n=>Math.max(0,Math.min(100,n));
// Energy values are game-design units, not physiological measurements.
const ENERGY={flight:.40,detour:7,light:{A:14,B:8,C:3},rest:{B:7,C:17},arrival:8};
// Decorative districts are stable, route-independent and outside the reachable
// path (pathX ± 23). Streets and alternate empty parcels preserve open space.
const CITY_BACKDROP=new Map();
function cityBackdrop(chapter){
 if(CITY_BACKDROP.has(chapter))return CITY_BACKDROP.get(chapter);
 const out=[],rows=[22,22,11,5,0][chapter]||0,start=cameraZ(STAGE_STARTS[chapter]||10);
 for(let row=0;row<rows;row++)for(const side of [-1,1])for(let col=0;col<6;col++){
  const seed=chapter*1009+row*37+col*13+(side+1)*7;
  if((row+col)%5===0||hash(seed+9)<.12)continue;

function initAudio(){

  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){$('mute').disabled=true;return}
  audioContext=new Audio();const buffer=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  const source=audioContext.createBufferSource();source.buffer=buffer;source.loop=true;
  const filter=audioContext.createBiquadFilter();filter.type='lowpass';filter.frequency.value=500;
  audioGain=audioContext.createGain();audioGain.gain.value=0;

 }catch{$('mute').disabled=true}

  else if(g.chapter===4&&g.progress<145)caption=tr('米埔濕地就在眼前，家人正在等待。','Mai Po lies ahead. Your family is waiting.');
 }
 if(g.energy<30&&g.interaction==='flight')caption=tr('體力偏低 · B 路線節省繞道體力，C 路線有較多停歇恢復；保持與鳥群距離。','Low energy · B saves detour energy; C offers stronger rests. Give flocks space.');
 setText('caption',caption);
 const notices=g.notices.slice(-2);setText('delta',notices.map(n=>`${n.health?`${tr('健康','Health')} ${n.health}`:''}${n.energy?`${tr('體力','Energy')} ${n.energy>0?'+':''}${n.energy}`:''}`).join(' · '));
 renderRoutes();renderLesson();renderRecovery();renderOutro();renderEnding();renderInterference();modalLanguageButtons();

function advance(dt){accumulator+=Math.min(dt,.1);while(accumulator>=1/60){g.tick(1/60,steering());accumulator-=1/60}updateUI()}
function frame(ms){const dt=last?Math.min((ms-last)/1000,.1):0;last=ms;advance(dt);renderer.draw(g,lang);requestAnimationFrame(frame)}
